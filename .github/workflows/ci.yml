name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The check name is what the branch ruleset requires: do not rename it.
  immutable:
    name: immutable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the check compares against the merge base.
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: tomet

      - name: Audit vocabularies with sisho-audit
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            nix develop -c sisho-audit check . --no-base
          else
            nix develop -c sisho-audit check . --base "$base"
          fi
